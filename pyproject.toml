[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ee5110-event-camera-sim"
version = "0.2.0"
description = "Event-camera simulator for high-frame-rate video"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.11",
    "numpy>=2.0",
    "opencv-python>=4.8",
    "PySide6>=6.5",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]
gui = [
    "PySide6>=6.5",
]

[tool.setuptools.packages.find]
where = ["src"]
